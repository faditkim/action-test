name: Release Train Tests

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
        - name: Hello World!
          shell: bash
          run: |
              echo "Hello World"

  robot-tests:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test: [buyfulfill, mac]
        include:
          - test: buyfulfill
            robot_including: team:buyfulfillANDngshop-rt
            robot_output_path: results/buy
            robot_retry_failed_count: 1
          - test: mac
            robot_variables: ENV:staging
            robot_including: team:macANDngshop-rt
            robot_excluding: no-run
            robot_output_path: results/mac
            robot_retry_failed_count: 1
    permissions:
      contents: read
      id-token: write
    outputs:
      buyfulfill_results_url: ${{ steps.run_robot_test.outputs.buyfulfill_results_url }}
      mac_results_url: ${{ steps.run_robot_test.outputs.mac_results_url }}
      robot_results_buyfulfill: ${{ steps.robot-summary.outputs.robot_results_buyfulfill }}
      robot_results_mac: ${{ steps.robot-summary.outputs.robot_results_mac }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Robot tests
        id: run_robot_test
        uses: faditkim/action-test/.github/actions/robot-test@main
        with: 
          test_path: ${{ matrix.test }}
          robot_variables: ${{ matrix.robot_variables }}
          robot_including: ${{ matrix.robot_including }}
          robot_excluding: ${{ matrix.robot_excluding }}
          robot_output_path: ${{ matrix.robot_output_path }}
          robot_retry_failed_count: ${{ matrix.robot_retry_failed_count }}

      - name: Remove output not related file
        shell: bash
        env:
            TEST_DOMAIN: ${{ matrix.test }}
        run: |
          if [[ $TEST_DOMAIN == *"mac"* ]]; then
            rm ms-teams-notification/nrp-cluster-status-notification/results/buyfulfill/output.xml
          elif [[ $TEST_DOMAIN == *"buyfulfill"* ]]; then
            rm ms-teams-notification/nrp-cluster-status-notification/results/mac/output.xml
          else
            echo "❌ NOT FOUND"
          fi

      - name: Parse Robot Framework results
        id: robot-summary
        if: always()
        run: |
          python - << 'EOF'
          import xml.etree.ElementTree as ET
          import os
          import glob
          import json

          passed = failed = total = 0
          teams = ['buyfulfill', 'mac']
          result_team_name = ""
          robot_results = []
          is_robot_success = "true"

          # Track notBlock tag failures
          non_block_failed = 0

          for team in teams:
              files = glob.glob(f"**/{team}/output.xml", recursive=True)
              if not files:
                  print(f"📌 ${team}/output.xml → Ignored")
              else:
                  print("✅ Found output.xml:", files[0])
                  tree = ET.parse(files[0])
                  root = tree.getroot()
                  tags = root.findall('statistics/tag/stat')

                  for tag in tags:
                      tag_text = tag.text.lower()
                      
                      # Get amount of non-blocking test failures
                      if tag_text == "notblock":
                          non_block_failed = int(tag.attrib['fail'])
                          if non_block_failed > 0:
                              print(f"⚠️  Found {non_block_failed} failures in 'notBlock' tagged tests - NOT blocking release train")
                      # Get amount of total test failure
                      elif tag_text == f"team:{team}":
                          result_team_name = team
                          passed = int(tag.attrib['pass'])
                          failed = int(tag.attrib['fail'])
                          total = passed + failed
              
          # Blocking failures = total failures - notBlock failures
          block_failed = failed - non_block_failed
          print(f"Robot Results / {result_team_name} → Total={total}, Passed={passed}, Block-Failed={block_failed}, Non-Block-Failed={non_block_failed}")
          robot_results.append(json.dumps({"team": result_team_name, "passed": passed, "failed": failed, "block_failed": block_failed, "non_block_failed": non_block_failed}))

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"robot_results_${{ matrix.test }}={robot_results}\n")
          EOF
  finalize:
    runs-on: ubuntu-latest
    needs: [robot-tests]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge Robot Results
        if: ${{ needs.robot-tests.result == 'success' }}
        id: merge-robot-results
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          #language=javascript
          script: |
            const buyFulfillRobotReuslt = ${{ needs.robot-tests.outputs.robot_results_buyfulfill }}
            const macRobotResult = ${{ needs.robot-tests.outputs.robot_results_mac }}
            is_robot_success = 'true'
            all_robot_success = 'true'

            const robot_results = buyFulfillRobotReuslt.concat(macRobotResult)
            for (const result of robot_results) {
                const parsedResult = JSON.parse(result);
                if (parsedResult.block_failed > 0) {
                    is_robot_success = 'false'
                }
                if (parsedResult.failed > 0) {
                    all_robot_success = 'false'
                }
            }
            core.setOutput('is_robot_success', is_robot_success);
            core.setOutput('all_robot_success', all_robot_success);
            core.setOutput('robot_results', robot_results);

      - name: Build AdaptiveCard payload for Teams
        if: ${{ steps.merge-robot-results.outputs.all_robot_success == 'false' }}
        id: build-card
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          # language=javascript
          script: |
            const batchUrl = 'https://www.google.com';
            const passedCount = '12';
            const failedCount = '0';
            const failedNonBlockingCount = '0';
            const previouslyPassedCount = '0';
            const timedOutCount = '0';
            const sourceEnv = 'development';
            const destEnv = 'staging';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const hasConflicts = false;
            const robot_results = ${{ steps.merge-robot-results.outputs.robot_results }};
            const buyLogUrl = '${{ needs.robot-tests.outputs.buyfulfill_results_url }}';
            const macLogUrl = '${{ needs.robot-tests.outputs.mac_results_url }}';
            const welcomeLogUrl = 'https://www.google.com';
            const msteams_entities = [];
            const msteamsTagBuy = '${{ secrets.NGSHOP_MS_TEAMS_TAG_BUY }}';
            const msteamsTagMac = '${{ secrets.NGSHOP_MS_TEAMS_TAG_MAC }}';
            const msteamsTagQA = '${{ secrets.NGSHOP_MS_TEAMS_TAG_QA }}';
            const msteamsTagWelcome = '${{ secrets.NGSHOP_MS_TEAMS_TAG_WELCOME }}';

            // Determine overall status
            // Use || 0 to handle empty strings and NaN values when steps are skipped
            const totalFailed = (parseInt(failedCount) || 0) + (parseInt(timedOutCount) || 0);
            const totalTests = (parseInt(passedCount) || 0) + totalFailed + (parseInt(failedNonBlockingCount) || 0) + (parseInt(previouslyPassedCount) || 0);
            const noTestsRan = totalTests === 0;

            // Build the body items - failure header only
            const bodyItems = [{
                type: "Container",
                style: "attention",
                items: [
                    {
                        type: "ColumnSet",
                        columns: [
                            {
                                type: "Column",
                                width: "auto",
                                items: [
                                    {
                                        type: "Image",
                                        url: "https://raw.githubusercontent.com/Skitionek/notify-microsoft-teams/master/icons/failure.png",
                                        size: "small"
                                    }
                                ]
                            },
                            {
                                type: "Column",
                                width: "stretch",
                                items: [
                                    {
                                        type: "TextBlock",
                                        text: `🚂 Release train from ${sourceEnv} to ${destEnv} failed!`,
                                        weight: "bolder",
                                        size: "large",
                                        wrap: true
                                    }
                                ]
                            }
                        ]
                    }
                ]
            }];

            // Add error message or test results
            if (noTestsRan) {
                bodyItems.push({
                    type: "TextBlock",
                    text: `ERROR: No tests ran. [Check workflow run](${runUrl})`,
                    wrap: true,
                    separator: true,
                    color: "attention"
                });
            } else {
                // Add datadog summary of test results
                datadogResult = `📊 Total: ${totalTests} \n✅ Passed: ${passedCount} \n❌ Failed: ${failedCount} \n`;
                datadogResult += `⚠️ Failed (Non-blocking): ${failedNonBlockingCount} \n ♻️ Previously Passed: ${previouslyPassedCount} \n`;
                datadogResult += `⏱️ Timed Out: ${timedOutCount}`;
                
                // Add Robot Tests summary of test results
                robotResultFactSet = [{ title: "Robot Results"}];
                for (const result of robot_results) {
                    const parsedResult = JSON.parse(result);
                    team = parsedResult.team;
                    passed = parsedResult.passed;
                    failed = parsedResult.failed;
                    blockingFailed = parsedResult.block_failed
                    nonBlockingFailed = parsedResult.non_block_failed
                    total = passed + failed;
                    
                    logUrl = ''
                    mentioned_id = ''
                    
                    switch (team) {
                      case 'buyfulfill':
                        team = 'buy'
                        logUrl = 'buyLogUrl'
                        mentioned_id = msteamsTagBuy
                        break;
                      case "mac":
                        logUrl = macLogUrl
                        mentioned_id = msteamsTagMac
                        break;
                      default:
                        console.log("❌ Test is not found...");
                    }
                    
                    // preparation for mention if test failed.
                    if (blockingFailed > 0) {
                        msteams_entities.push({
                            type: "mention",
                            text: `<at>${team}</at>`,
                            mentioned: {
                                id: mentioned_id,
                                name: team,
                                type: "tag"
                            }
                        });
                        team = `<at>${team}</at>`;
                        robotResultFactSet[0].value = "<at>qa</at>";
                    }
                    value = `[📊 Total: ${total}](${logUrl}) ✅ Passed: ${passed} ❌ Failed: ${blockingFailed} \n⚠️ Failed (Non-blocking): ${nonBlockingFailed}`;
                    robotResultFactSet.push({ title: team, value: value});
                }
                // add qa mention if any test failed to notify qa team
                if (msteams_entities.length > 0) {
                    msteams_entities.push({
                        type: "mention",
                        text: "<at>qa</at>",
                        mentioned: {
                            id: msteamsTagQA,
                            name: "qa",
                            type: "tag"
                        }
                    });
                }

                bodyItems.push({
                    type: "Container",
                    separator: true,
                    items: [
                        {
                            type: "TextBlock",
                            text: "Test Summary",
                            weight: "bolder",
                            size: "medium"
                        },
                        {
                            type: "FactSet",
                            facts: [
                                // Datadog results
                                { title: "Datadog Results", value: datadogResult }
                            ]
                        },
                        {
                            type: "FactSet",
                            spacing: "Large",
                            // Robot results
                            facts: robotResultFactSet
                        }
                    ]
                });
            }

            // Add merge conflict warning if applicable
            if (hasConflicts) {
                bodyItems.push({
                    type: "TextBlock",
                    text: "⚠️ This PR also has **merge conflicts** and was closed. Affected services will be picked up by the next release train run.",
                    wrap: true,
                    separator: true,
                    color: "attention"
                });
            }

            // Build actions array - only include Datadog link if we have a batch URL
            const actions = [];
            if (batchUrl) {
                actions.push({
                    type: "Action.OpenUrl",
                    title: "View Synthetic Test Results",
                    url: batchUrl
                });
            }
            
            const prUrl = `https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}`;
            actions.push({
                type: "Action.OpenUrl",
                title: "View Release Train PR",
                url: prUrl
            });
            
            actions.push({
                type: "Action.OpenUrl",
                title: "Github Action Run",
                url: runUrl
            });

            // Build the complete card
            const card = {
                type: "message",
                attachments: [
                    {
                        contentType: "application/vnd.microsoft.card.adaptive",
                        content: {
                            $schema: "http://adaptivecards.io/schemas/adaptive-card.json",
                            type: "AdaptiveCard",
                            version: "1.4",
                            msteams: {
                                entities: msteams_entities
                            },
                            body: bodyItems,
                            actions: actions
                        }
                    }
                ]
            };

            // Output the card as a JSON string
            core.setOutput('card_payload', JSON.stringify(card));
            console.log(JSON.stringify(card, null, 4));
      
      - name: Send notification to MS Teams
        if: ${{ steps.merge-robot-results.outputs.is_robot_success == 'false' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          #language=javascript
          script: |
            const robot_results = ${{ steps.build-card.outputs.card_payload }};
            console.log(JSON.stringify(robot_results, null, 4));
      
      - name: Send notification to MS Teams to internal
        if: ${{ steps.merge-robot-results.outputs.all_robot_success == 'false' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          #language=javascript
          script: |
            const robot_results = ${{ steps.build-card.outputs.card_payload }};
            console.log(JSON.stringify(robot_results, null, 4));
