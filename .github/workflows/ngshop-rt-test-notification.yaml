name: Release Train Tests

on:
  workflow_dispatch:

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      test_results_url: ${{ steps.run_robot_test.outputs.test_results_url }}
      robotResults: ${{ steps.robot-summary.outputs.robotResults }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Robot Framework tests
        id: run_robot_test
        continue-on-error: true
        run: |
          python - << 'EOF'
            a = 1/0
          EOF

      - name: Parse Robot Framework results
        id: robot-summary
        if: always()
        run: |
          python - << 'EOF'
          import xml.etree.ElementTree as ET
          import os
          import glob
          import json

          passed = failed = total = totalFailed = 0
          teams = ['buyfulfill']
          robotResults = []

          files = glob.glob("**/output.xml", recursive=True)
          if not files:
              print("❌ output.xml not found")
          else:
              print("✅ Found output.xml:", files[0])
              tree = ET.parse(files[0])
              root = tree.getroot()
              tags = root.findall('statistics/tag/stat')
              for tag in tags:
                  if tag.text.startswith("team:"):
                      team = tag.text.split(":")[1]
                      if team in teams:
                          passed = int(tag.attrib['pass'])
                          failed = int(tag.attrib['fail'])
                          total = passed + failed
                          totalFailed += failed
                          print(f"Robot Results / {team} → Passed={passed}, Failed={failed}, Total={total}")
                          print(f"totalFailed / {totalFailed}")
                          robotResults.append(json.dumps({"team": team, "passed": passed, "failed": failed}))
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"robotResults={robotResults}\n")
                  f.write(f"totalFailed={totalFailed}\n")
                  
          EOF

  finalize:
    runs-on: ubuntu-latest
    needs: [robot-tests]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Build AdaptiveCard payload for Teams
        if: ${{ needs.robot-tests.outputs.totalFailed > 0}}
        id: build-card
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          # language=javascript
          script: |
            const batchUrl = 'https://www.google.com';
            const passedCount = '12';
            const failedCount = '0';
            const failedNonBlockingCount = '0';
            const previouslyPassedCount = '0';
            const timedOutCount = '0';
            const sourceEnv = 'development';
            const destEnv = 'staging';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const hasConflicts = false;
            const robotResults = ${{ needs.robot-tests.outputs.robotResults }}; // array
            const buyLogUrl = '${{ needs.robot-tests.outputs.test_results_url }}';
            const macLogUrl = '${{ needs.robot-tests.outputs.mac_results_url }}';
            const welcomeLogUrl = '${{ needs.robot-tests.outputs.welcome_results_url }}';
            const msteams_entities = [];
            const msteamsTagBuy = '${{ secrets.NGSHOP_MS_TEAMS_TAG_BUY }}';
            const msteamsTagMac = '${{ secrets.NGSHOP_MS_TEAMS_TAG_MAC }}';
            const msteamsTagQA = '${{ secrets.NGSHOP_MS_TEAMS_TAG_QA }}';
            const msteamsTagWelcome = '${{ secrets.NGSHOP_MS_TEAMS_TAG_WELCOME }}';
            const jobResult = '${{needs.robot-tests.outputs.totalFailed}}';

            // Determine overall status
            // Use || 0 to handle empty strings and NaN values when steps are skipped
            const totalFailed = (parseInt(failedCount) || 0) + (parseInt(timedOutCount) || 0);
            const totalTests = (parseInt(passedCount) || 0) + totalFailed + (parseInt(failedNonBlockingCount) || 0) + (parseInt(previouslyPassedCount) || 0);
            const noTestsRan = totalTests === 0;

            // Build the body items - failure header only
            const bodyItems = [{
                type: "Container",
                style: "attention",
                items: [
                    {
                        type: "ColumnSet",
                        columns: [
                            {
                                type: "Column",
                                width: "auto",
                                items: [
                                    {
                                        type: "Image",
                                        url: "https://raw.githubusercontent.com/Skitionek/notify-microsoft-teams/master/icons/failure.png",
                                        size: "small"
                                    }
                                ]
                            },
                            {
                                type: "Column",
                                width: "stretch",
                                items: [
                                    {
                                        type: "TextBlock",
                                        text: `🚂 Release train from ${sourceEnv} to ${destEnv} failed!`,
                                        weight: "bolder",
                                        size: "large",
                                        wrap: true
                                    }
                                ]
                            }
                        ]
                    }
                ]
            }];

            // Add error message or test results
            if (noTestsRan) {
                bodyItems.push({
                    type: "TextBlock",
                    text: `ERROR: No tests ran. [Check workflow run](${runUrl})`,
                    wrap: true,
                    separator: true,
                    color: "attention"
                });
            } else {
                // Add datadog summary of test results
                datadogResult = `📊 Total: ${totalTests} \n✅ Passed: ${passedCount} \n❌ Failed: ${failedCount} \n`;
                datadogResult += `⚠️ Failed (Non-blocking): ${failedNonBlockingCount} \n ♻️ Previously Passed: ${previouslyPassedCount} \n`;
                datadogResult += `⏱️ Timed Out: ${timedOutCount}`;
                
                // Add Robot Tests summary of test results
                robotResultFactSet = [{ title: "Robot Results"}];
                for (const result of robotResults) {
                    const parsedResult = JSON.parse(result);
                    team = parsedResult.team;
                    passed = parsedResult.passed;
                    failed = parsedResult.failed;
                    total = passed + failed;
                    value = `📊 Total: ${total} ✅ Passed: ${passed} ❌ Failed: ${failed}`;
                    team = (team === 'buyfulfill') ? 'buy' : team;
                    // preparation for mention if test failed.
                    if (failed > 0) {
                        mentioned_id = (team === 'buy') ? msteamsTagBuy : ((team === 'welcome') ? msteamsTagWelcome : msteamsTagMac);
                        msteams_entities.push({
                            type: "mention",
                            text: `<at>${team}</at>`,
                            mentioned: {
                                id: mentioned_id,
                                name: team,
                                type: "tag"
                            }
                        });
                        logUrl = (team === 'buy') ? buyLogUrl : ((team === 'welcome') ? welcomeLogUrl : macLogUrl);
                        team = `<at>${team}</at>`;
                        robotResultFactSet[0].value = "<at>qa</at>";
                        value = `📊 Total: ${total} ✅ Passed: ${passed} [❌ Failed: ${failed}](${logUrl})`;
                    }
                    robotResultFactSet.push({ title: team, value: value});
                }
                // add qa mention if any test failed to notify qa team
                if (msteams_entities.length > 0) {
                    msteams_entities.push({
                        type: "mention",
                        text: "<at>qa</at>",
                        mentioned: {
                            id: msteamsTagQA,
                            name: "qa",
                            type: "tag"
                        }
                    });
                }

                bodyItems.push({
                    type: "Container",
                    separator: true,
                    items: [
                        {
                            type: "TextBlock",
                            text: "Test Summary",
                            weight: "bolder",
                            size: "medium"
                        },
                        {
                            type: "FactSet",
                            facts: [
                                // Datadog results
                                { title: "Datadog Results", value: datadogResult }
                            ]
                        },
                        {
                            type: "FactSet",
                            spacing: "Large",
                            // Robot results
                            facts: robotResultFactSet
                        }
                    ]
                });
            }

            // Add merge conflict warning if applicable
            if (hasConflicts) {
                bodyItems.push({
                    type: "TextBlock",
                    text: "⚠️ This PR also has **merge conflicts** and was closed. Affected services will be picked up by the next release train run.",
                    wrap: true,
                    separator: true,
                    color: "attention"
                });
            }

            // Build actions array - only include Datadog link if we have a batch URL
            const actions = [];
            if (batchUrl) {
                actions.push({
                    type: "Action.OpenUrl",
                    title: "View Synthetic Test Results",
                    url: batchUrl
                });
            }
            
            const prUrl = `https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}`;
            actions.push({
                type: "Action.OpenUrl",
                title: "View Release Train PR",
                url: prUrl
            });
            
            actions.push({
                type: "Action.OpenUrl",
                title: "Github Action Run",
                url: runUrl
            });

            // Build the complete card
            const card = {
                type: "message",
                attachments: [
                    {
                        contentType: "application/vnd.microsoft.card.adaptive",
                        content: {
                            $schema: "http://adaptivecards.io/schemas/adaptive-card.json",
                            type: "AdaptiveCard",
                            version: "1.4",
                            msteams: {
                                entities: msteams_entities
                            },
                            body: bodyItems,
                            actions: actions
                        }
                    }
                ]
            };

            // Output the card as a JSON string
            core.setOutput('card_payload', JSON.stringify(card));
            console.log(JSON.stringify(card, null, 4));
